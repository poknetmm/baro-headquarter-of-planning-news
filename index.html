<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>바로 기획본부 뉴스</title>
<meta property="og:title" content="바로 기획본부 뉴스">
<meta property="og:description" content="데일리 금융 뉴스 브리핑 — 대부업 · 2금융권 · 가계대출 정책 · 금융보안 · 금융 AI, 그리고 오늘의 증시">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* ===== 서체·지면 시안 D(2026-09-10 확정): Gothic A1 제목 + IBM Plex Sans KR 본문 17px, 패널 구조, 본문 1단 + 우측 레일 ===== */
:root{--bg:#F1F3F6;--surface:#FFFFFF;--surface-2:#F5F7FA;--ink:#111418;--ink-2:#333A45;--muted:#5B6473;--rule:#DDE2E9;--rule-strong:#A3ACB9;--masthead-rule:#111418;--accent:#0B4FB3;--accent-ink:#FFFFFF;--accent-soft:#E3ECFA;--up:#C62828;--down:#1E63B4;--up-soft:#FBEBEB;--down-soft:#E7F0FA;--chart-grid:#E5E9EF;--band:#F3D9D9;--shadow:0 1px 0 rgba(17,20,24,.05);--radius:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1319;--surface:#161C25;--surface-2:#1B222D;--ink:#E9ECF1;--ink-2:#C3C9D3;--muted:#98A1B1;--rule:#28303D;--rule-strong:#4A5466;--masthead-rule:#E9ECF1;--accent:#9DBCF0;--accent-ink:#0E1319;--accent-soft:#1D2A40;--up:#F26C6A;--down:#62A6F2;--up-soft:#3A2024;--down-soft:#1A2A40;--chart-grid:#242C38;--band:#3A2024;--shadow:none}}
:root[data-theme="dark"]{--bg:#0E1319;--surface:#161C25;--surface-2:#1B222D;--ink:#E9ECF1;--ink-2:#C3C9D3;--muted:#98A1B1;--rule:#28303D;--rule-strong:#4A5466;--masthead-rule:#E9ECF1;--accent:#9DBCF0;--accent-ink:#0E1319;--accent-soft:#1D2A40;--up:#F26C6A;--down:#62A6F2;--up-soft:#3A2024;--down-soft:#1A2A40;--chart-grid:#242C38;--band:#3A2024;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
h1,h2,h3,h4,.arch .h,.lede{word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,h4,.ph .no,.mcard .v,.fig .v,.card .v,.usrow .v,.keys .k,.archlist .d{font-family:"Gothic A1","IBM Plex Sans KR","Noto Sans KR","Malgun Gothic",sans-serif}
.page{max-width:1140px;margin:0 auto;padding:0 20px 48px}
/* 제호(중앙) */
.masthead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:30px 0 18px}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px}.brand .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.brand h1{margin:0;font-weight:900;font-size:40px;line-height:1.1;letter-spacing:-.03em}.brand h1 span{color:var(--accent)}.brand .sub{font-size:13.5px;color:var(--muted);margin-top:4px}
.brand .tagline{font-family:"Gothic A1",sans-serif;font-size:15px;font-weight:700;color:var(--ink-2);margin-top:10px;letter-spacing:-.01em}
.tools{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:4px;font-size:14px}.datenav a,.datenav span{padding:6px 11px;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}.datenav span.cur{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}.datenav a.dis{color:var(--muted);pointer-events:none}
.actions{display:flex;gap:8px;font-size:14px}.actions a{padding:6px 12px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--surface)}.actions a.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* 지면 탭 + 지수 띠(하나의 패널) */
.pnav{display:flex;flex-wrap:wrap;justify-content:center;border:1px solid var(--rule);border-radius:var(--radius) var(--radius) 0 0;background:var(--surface);font-size:14.5px}.pnav a{padding:12px 18px;white-space:nowrap;font-weight:600;color:var(--ink-2)}.pnav a b{color:var(--muted);font-weight:500;margin-right:6px;font-size:12px}.pnav a.on{color:var(--accent);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}.pnav a.off{color:var(--muted)}
.ticker{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--rule);border-radius:0 0 var(--radius) var(--radius);background:var(--surface)}.pnav + .ticker{border-top:0}.ticker:first-child,.backlink + .ticker,.masthead + .ticker{border-radius:var(--radius)}
.ticker div{padding:11px 12px;border-right:1px solid var(--rule);display:flex;justify-content:center;gap:4px 8px;align-items:baseline;font-size:14px;white-space:nowrap;flex-wrap:wrap;min-width:0}.ticker div:last-child{border-right:0}.ticker .n{color:var(--ink-2);font-weight:500}.ticker .v{font-weight:700}.ticker .c{font-size:13px;font-weight:700}
.sec{display:flex;align-items:center;gap:10px;margin:0 0 12px}.sec h2{margin:0;font-size:14.5px;font-weight:700;letter-spacing:.02em;color:var(--ink)}.sec::after{content:"";flex:1;height:1px;background:var(--rule)}.sec .meta{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:4px;background:var(--accent);color:var(--accent-ink);margin-bottom:8px}.tag.warn{background:var(--up);color:#fff}.tag.gov{background:var(--down);color:#fff}
.srcline{font-size:13px;color:var(--muted);margin-top:8px}.srcline a{text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--rule-strong)}
.backlink{margin-top:14px;font-size:14px}.backlink a{color:var(--accent);font-weight:700}
.loading{margin:80px auto;max-width:420px;text-align:center;color:var(--muted);font-size:14px}
.empty{margin:60px auto;max-width:560px;text-align:center;color:var(--muted)}
/* ===== 1면(확장판): 본문 1단 + 우측 레일 ===== */
.front{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;margin-top:18px}.front>*{padding:24px 28px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);min-width:0}.front>:last-child{padding:20px 22px}
.front .eyebrow{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.04em}.front h2.head{font-weight:900;font-size:34px;line-height:1.32;letter-spacing:-.03em;margin:6px 0 20px;text-wrap:balance}
.keys{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}.keys li{display:grid;grid-template-columns:1fr;gap:4px;padding:16px 0;border-bottom:1px solid var(--rule);font-size:17px;line-height:1.85}.keys .k{font-size:14px;font-weight:800;color:var(--ink)}.keys .k small{display:inline;margin-left:6px;color:var(--muted);font-weight:400;font-size:12.5px;font-family:inherit}.keys p{margin:0;color:var(--ink);max-width:68ch}.keys p.flat{color:var(--muted)}.keys a.more{font-size:13px;color:var(--accent);font-weight:600;margin-left:6px;white-space:nowrap}
.mkt h3{font-weight:800;font-size:19px;line-height:1.4;margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance}.mkt p{margin:0 0 10px;font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.mcards{display:grid;grid-template-columns:1fr;gap:0;margin:12px 0;border-top:2px solid var(--ink)}.mcard{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule)}.mcard .n{font-size:14px;font-weight:700;color:var(--ink-2)}.mcard .v{font-size:16px;font-weight:800;line-height:1.2}.mcard .c{font-size:13.5px;font-weight:700}
.usline{font-size:14px;padding:8px 12px;background:var(--surface-2);border-left:3px solid var(--ink);border-radius:6px;margin:0 0 10px}.usline b{margin-right:6px}
.mwatch{list-style:none;margin:0;padding:0;font-size:14px;line-height:1.7}.mwatch li{padding:7px 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:86px 1fr;gap:10px}.mwatch .w{font-weight:700;color:var(--ink-2);font-size:12.5px;padding-top:2px}.mwatch li>span{min-width:0;overflow-wrap:anywhere}
.mini{font-size:13px;color:var(--muted);margin-top:10px}.mini a{text-decoration:underline}
/* 데스크 칼럼(1단, 68자) */
.column{margin-top:20px;background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:var(--radius);padding:24px 28px 22px}.column .ch{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:10px}.column .ch .lab{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}.column .ch h2{margin:0;font-weight:900;font-size:26px;line-height:1.35;letter-spacing:-.02em;text-wrap:balance}.column .ch .by{font-size:13.5px;color:var(--muted)}
.column .cbody{font-size:17px;line-height:1.9;max-width:68ch}.column .cbody p{margin:0 0 16px}.column .cfoot{font-size:13px;color:var(--muted);margin-top:8px;max-width:68ch}
/* 지면(패널) */
.paper{margin-top:20px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}.paper .ph{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--surface-2);border-bottom:1px solid var(--rule);flex-wrap:wrap}.paper .ph .no{font-weight:900;font-size:15px;background:var(--accent);color:var(--accent-ink);padding:5px 11px;border-radius:5px}.paper .ph h2{margin:0;font-weight:800;font-size:22px;letter-spacing:-.02em}.paper .ph .meta{font-size:13px;color:var(--muted);margin-left:auto}.paper .none{color:var(--muted);font-size:15px;padding:18px 28px}
.pg{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;padding:24px 0}.pg>*{padding:0 28px;min-width:0}.pg>:last-child{border-left:1px solid var(--rule)}
.lead h3{font-weight:900;font-size:27px;line-height:1.38;letter-spacing:-.025em;margin:4px 0 14px;text-wrap:balance}.lead p{margin:0 0 12px;font-size:17px;line-height:1.9;max-width:68ch}
.fig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 14px}.fig div{background:var(--surface-2);border-radius:6px;padding:10px 12px;min-width:0}.fig .n{font-size:12.5px;color:var(--muted)}.fig .v{font-size:19px;font-weight:800;display:block;line-height:1.3}.fig .c{font-size:13px;color:var(--ink-2)}.fig .ss{font-size:11px;color:var(--up);margin-left:4px;font-weight:700;font-family:inherit}
.subs{list-style:none;margin:0;padding:0}.subs li{padding:16px 0;border-bottom:1px solid var(--rule)}.subs li:first-child{padding-top:0}.subs li:last-child{border-bottom:0}.subs h3{font-weight:800;font-size:17.5px;line-height:1.45;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}.subs p{margin:0;font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.gov{list-style:none;margin:0;padding:0;font-size:14px;line-height:1.7}.gov li{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}.gov .d{color:var(--muted);font-size:12.5px;padding-top:2px}.gov li>span{min-width:0;overflow-wrap:anywhere}
.related{font-size:13px;color:var(--muted);margin-top:8px}
.desk{margin-top:22px;background:var(--surface-2);border-left:4px solid var(--accent);border-radius:6px;padding:14px 18px 12px;max-width:68ch}.desk .lab{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.desk .lab span{font-weight:400;letter-spacing:0;color:var(--muted)}.desk h4{margin:0 0 8px;font-weight:800;font-size:19px;line-height:1.45}.desk p{margin:0;font-size:16px;line-height:1.9;color:var(--ink)}
.srcs{margin-top:20px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:20px 28px}.srcs ul{list-style:none;margin:0;padding:0;columns:2;column-gap:32px;font-size:14px}.srcs li{break-inside:avoid;padding:6px 0;border-bottom:1px solid var(--rule)}.srcs li b{color:var(--muted);font-weight:500;margin-right:6px;font-family:inherit}.srcs li i{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}.srcs a{color:var(--ink-2)}
/* ===== 증시 상세·구판 화면(.grid 3단) ===== */
.grid{display:grid;grid-template-columns:5fr 3.2fr 4fr;gap:0;margin-top:20px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:24px 0}.col{padding:0 24px;min-width:0}.col + .col{border-left:1px solid var(--rule)}
.hero .eyebrow{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.hero h2.head{font-weight:900;font-size:30px;line-height:1.32;letter-spacing:-.03em;margin:6px 0 14px;text-wrap:balance}
.hero .lede{font-size:16px;color:var(--ink-2);margin:0 0 16px;text-wrap:pretty}
.hero-chart{background:var(--surface-2);border-radius:6px;padding:14px 14px 8px;margin:0 0 16px}.hero-chart .cap{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:6px;gap:12px;flex-wrap:wrap}.hero-chart .cap b{color:var(--ink);font-size:14px}.hero-chart svg{width:100%;height:auto;display:block}
.body p{margin:0 0 12px;color:var(--ink);font-size:16px;line-height:1.85}.body p:last-child{margin-bottom:0}
.flow{margin:16px 0 0;background:var(--surface-2);border-left:3px solid var(--ink);border-radius:6px;padding:12px 14px 10px}.flow .t{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}.flow .t span{font-weight:400;color:var(--muted)}.flow svg{width:100%;height:auto;display:block}
.sub2{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:22px;border-top:1px solid var(--rule)}.sub2 article{padding:16px 18px 0 0;min-width:0}.sub2 article + article{border-left:1px solid var(--rule);padding-left:18px;padding-right:0}
.sub2 h3,.mid h3,.side h3{font-weight:800;font-size:18px;line-height:1.45;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}.sub2 p,.mid p{margin:0;font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.mid .featured{padding-bottom:16px;border-bottom:1px solid var(--rule)}.mid .featured h3{font-size:21px;line-height:1.38}
.usrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:10px 0 12px}.usrow div{background:var(--surface-2);border-radius:6px;padding:9px 10px;min-width:0}.usrow .n{font-size:12.5px;color:var(--muted)}.usrow .v{font-size:16px;font-weight:800;display:block}.usrow .c{font-size:13px;font-weight:700}
.list{list-style:none;margin:0;padding:0}.list li{padding:14px 0;border-bottom:1px solid var(--rule)}.list li:last-child{border-bottom:0}.list .k{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-bottom:3px}.list h3{font-size:16.5px}.list p{font-size:14px}
.views{margin:6px 0 0}.views dt{font-weight:700;font-size:14px;margin-top:8px}.views dd{margin:0;font-size:14px;color:var(--ink-2)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--surface-2);border-radius:6px;padding:12px 13px 10px;position:relative;overflow:hidden;min-width:0}.card .n{font-size:13px;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between}.card .n small{font-weight:400;color:var(--muted);font-size:11.5px}.card .v{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.15;margin-top:4px}.card .v span{font-size:13px;font-weight:500;color:var(--muted);font-family:inherit}.card .c{font-size:13px;font-weight:700;margin-top:1px}.card .c span{font-weight:400;color:var(--muted);margin-left:6px}.card svg{width:100%;height:44px;display:block;margin-top:8px}.card .note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stripe,transparent)}.card.up{--stripe:var(--up)}.card.down{--stripe:var(--down)}
.watch{margin-top:22px}.watch ol{list-style:none;margin:0;padding:0}.watch li{display:grid;grid-template-columns:80px 1fr;gap:12px;padding:10px 0;border-bottom:1px dotted var(--rule-strong);font-size:14px}.watch li:last-child{border-bottom:0}.watch .when{font-size:12.5px;font-weight:700;color:var(--accent);line-height:1.5;padding-top:1px}.watch b{font-weight:700}.watch small{display:block;color:var(--muted);font-size:12.5px}.watch li>div{min-width:0;overflow-wrap:anywhere}
.sources{margin-top:22px}.sources ul{list-style:none;margin:0;padding:0}.sources li{font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--rule);display:flex;gap:8px}.sources li:last-child{border-bottom:0}.sources .src{flex:none;color:var(--muted);min-width:64px}.sources a{color:var(--ink-2)}
.band{margin-top:20px;background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:var(--radius);padding:20px 28px}.band .sec h2{color:var(--ink)}.impl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.impl div{background:var(--surface-2);border-radius:6px;padding:14px 14px 16px;min-width:0}.impl .k{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin-bottom:6px}.impl p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.6}
/* 지난 호 · 아카이브 */
.archive{margin-top:20px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:20px 28px}.arch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.arch a{display:block;background:var(--surface-2);border-radius:6px;padding:12px 14px;min-height:112px;min-width:0}.arch a:hover{text-decoration:none;box-shadow:inset 0 0 0 1px var(--rule-strong)}.arch .d{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}.arch .d b{font-weight:700}.arch .h{font-family:"Gothic A1",sans-serif;font-weight:800;font-size:15px;line-height:1.45;margin-top:6px;color:var(--ink);text-wrap:balance;letter-spacing:-.01em}.arch a.more{display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;font-size:14px;background:var(--accent-soft)}
.archlist{list-style:none;margin:20px 0 0;padding:0;background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius)}.archlist li{display:grid;grid-template-columns:110px 1fr 150px;gap:14px;padding:13px 20px;border-bottom:1px solid var(--rule);align-items:baseline}.archlist li:last-child{border-bottom:0}.archlist .d{font-weight:800}.archlist .h{font-family:"Gothic A1",sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em}.archlist .k{text-align:right;font-size:14px}
footer{margin-top:24px;padding-top:14px;border-top:1px solid var(--rule);font-size:12.5px;line-height:1.6;color:var(--muted);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}footer p{margin:0;max-width:820px}
/* ===== 반응형 ===== */

<script>
window.__drawCharts = function(){
  var Q=window.__Q||{}, B=window.__B||{}, SYM=window.__SYM||{}, ORDER=window.__ORDER||[];
  var fmt=function(v,d){return Number(v).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});};
  var sgn=function(v){return v>0?'+':(v<0?'-':'');};
  var mdd=function(iso){var p=String(iso).split('-');return (+p[1])+'/'+(+p[2]);};
  function spark(sym){
    var s=Q[sym]||[]; if(s.length<2) return '<div class="note">추이 데이터 축적 중</div>';
    var W=220,H=44,pad=4,n=s.length,vals=s.map(function(r){return +r.close;});
    var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),span=(max-min)||1;
    var x=function(i){return pad+i*(W-2*pad)/(n-1);},y=function(v){return H-pad-(v-min)*(H-2*pad)/span;};
    var pts=vals.map(function(v,i){return [x(i),y(v)];});
    var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
    var area=line+' L'+pts[n-1][0].toFixed(1)+' '+H+' L'+pts[0][0].toFixed(1)+' '+H+' Z';
    var last=s[n-1], col=(+last.chg)>0?'var(--up)':'var(--down)', meta=SYM[sym]||{dec:2,unit:''};
    var tips=pts.map(function(p,i){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="9" fill="transparent"><title>'+mdd(s[i].quote_date)+' '+fmt(vals[i],meta.dec)+meta.unit+'</title></circle>';}).join('');
    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-label="최근 '+n+'영업일 종가"><line x1="0" x2="'+W+'" y1="'+(H-.5)+'" y2="'+(H-.5)+'" stroke="var(--chart-grid)"/><path d="'+area+'" fill="'+col+'" opacity=".10"/><path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="'+pts[n-1][0]+'" cy="'+pts[n-1][1]+'" r="3.2" fill="'+col+'" stroke="var(--surface)" stroke-width="1.5"/>'+tips+'</svg>';
  }
  document.querySelectorAll('[data-spark]').forEach(function(el){el.innerHTML=spark(el.getAttribute('data-spark'));});

  var hero=document.getElementById('heroChart');
  if(hero){
    var sym=hero.getAttribute('data-sym')||'KOSPI', s=Q[sym]||[];
    if(s.length<2){ hero.outerHTML='<div class="note" style="padding:20px 0;color:var(--muted);font-size:12px">종가 이력이 2영업일 이상 쌓이면 추이 차트가 표시됩니다.</div>'; }
    else {
      var W=640,H=230,L=64,R=20,T=18,Bm=34,n=s.length,vals=s.map(function(r){return +r.close;});
      var last=s[n-1], hi=last.high!=null?+last.high:null, lo=last.low!=null?+last.low:null;
      var all=vals.slice(); if(hi!=null) all.push(hi); if(lo!=null) all.push(lo);
      var min=Math.min.apply(null,all),max=Math.max.apply(null,all); var pv=(max-min)*0.08||1; min-=pv; max+=pv;
      var x=function(i){return L+i*(W-L-R)/(n-1);},y=function(v){return T+(max-v)*(H-T-Bm)/(max-min);};
      var raw=(max-min)/4, mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)), step=[1,2,5,10].map(function(m){return m*mag;}).filter(function(v){return v>=raw;})[0]||mag*10;
      var out='', t0=Math.ceil(min/step)*step;
      for(var v=t0; v<=max; v+=step){ out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--chart-grid)"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="inherit">'+fmt(v,0)+'</text>'; }
      if(hi!=null&&lo!=null){ var bx=x(n-1),bw=22; out+='<rect x="'+(bx-bw/2)+'" y="'+y(hi)+'" width="'+bw+'" height="'+(y(lo)-y(hi))+'" fill="var(--band)" rx="2"/><line x1="'+(bx-bw/2)+'" x2="'+(bx+bw/2)+'" y1="'+y(hi)+'" y2="'+y(hi)+'" stroke="var(--up)" stroke-width="1.5"/><line x1="'+(bx-bw/2)+'" x2="'+(bx+bw/2)+'" y1="'+y(lo)+'" y2="'+y(lo)+'" stroke="var(--up)" stroke-width="1.5"/><text x="'+(bx-bw/2-6)+'" y="'+(y(hi)-4)+'" text-anchor="end" font-size="11" fill="var(--ink-2)" font-family="inherit">고 '+fmt(hi,2)+'</text><text x="'+(bx-bw/2-6)+'" y="'+(y(lo)+13)+'" text-anchor="end" font-size="11" fill="var(--ink-2)" font-family="inherit">저 '+fmt(lo,2)+'</text>'; }
      var pts=vals.map(function(v,i){return [x(i),y(v)];});
      out+='<path d="'+pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ')+'" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
      var mn=Math.min.apply(null,vals), labelEvery=Math.max(1,Math.ceil(n/8));
      pts.forEach(function(p,i){
        var v=vals[i], prev=i?vals[i-1]:null, c=prev==null?'var(--ink)':(v>=prev?'var(--up)':'var(--down)');
        out+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(n>10?3:4)+'" fill="'+c+'" stroke="var(--surface)" stroke-width="1.5"><title>'+mdd(s[i].quote_date)+' 종가 '+fmt(v,2)+'</title></circle>';
        if(i%labelEvery===0||i===n-1) out+='<text x="'+p[0]+'" y="'+(H-12)+'" text-anchor="middle" font-size="11.5" fill="var(--ink-2)" font-family="inherit">'+mdd(s[i].quote_date)+'</text>';
        if(i===0||i===n-1||v===mn){ var dy=(v===mn&&i!==n-1)?18:-10; out+='<text x="'+p[0]+'" y="'+(p[1]+dy)+'" text-anchor="'+(i===n-1?'end':(i===0?'start':'middle'))+'" font-size="12" font-weight="700" fill="var(--ink)" font-family="inherit">'+fmt(v,2)+'</text>'; }
      });
      hero.innerHTML=out;
    }
  }

  var flow=document.getElementById('flowChart');
  var F=(B.kr&&B.kr.flows&&B.kr.flows.items)||[];
  if(flow&&F.length){
    var W2=560,H2=30+26*F.length+14,L2=68,R2=20,rowH=26,T2=10,LBL=88;
    var maxAbs=Math.max.apply(null,F.map(function(f){return Math.abs(+f.value);}))||1;
    var zero=L2+(W2-L2-R2)/2, half=(W2-L2-R2)/2-LBL, sx=function(v){return v*half/maxAbs;};
    var o='<line x1="'+zero+'" x2="'+zero+'" y1="'+(T2-4)+'" y2="'+(T2+rowH*F.length)+'" stroke="var(--rule-strong)"/>';
    F.forEach(function(f,i){
      var v=+f.value, yy=T2+i*rowH, h=16, w=Math.abs(sx(v)), x0=v>=0?zero:zero-w, col=v>=0?'var(--up)':'var(--down)';
      var a=Math.abs(v), label=sgn(v)+(a>=10000?Math.floor(a/10000)+'조'+(a%10000?fmt(a%10000,0)+'억':''):fmt(a,0)+'억');
      var lx=v>=0?zero+w+8:zero-w-8;
      o+='<text x="'+(L2-8)+'" y="'+(yy+h/2+4)+'" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--ink-2)" font-family="inherit">'+f.name+'</text><rect x="'+x0+'" y="'+yy+'" width="'+w+'" height="'+h+'" fill="'+col+'" rx="2"><title>'+f.name+' '+label+'</title></rect><text x="'+lx+'" y="'+(yy+h/2+4)+'" text-anchor="'+(v>=0?'start':'end')+'" font-size="12.5" font-weight="700" fill="var(--ink)" font-family="inherit">'+label+'</text>';
    });
    o+='<text x="'+zero+'" y="'+(T2+rowH*F.length+14)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="inherit">순매도 ← 0 → 순매수'+(B.kr.flows.note?' · '+B.kr.flows.note:'')+'</text>';
    flow.setAttribute('viewBox','0 0 '+W2+' '+H2); flow.innerHTML=o;
  }
};
</script>
<script>
/* 바로 기획본부 뉴스 — 정적 첫 화면 (GitHub Pages)
 * 데이터: Supabase public.briefs / public.index_quotes 를 익명 키(RLS: 게시본만 읽기)로 직접 조회.
 * 주소: index.html (최신) · ?date=YYYY-MM-DD (해당 호) · ?view=archive (목록)
 */
(function () {
  var CFG = window.NEWS_CONFIG;
  var SITE_NAME = CFG.siteName;
  var SYMBOLS = {
    KOSPI: { name: "코스피", unit: "", dec: 2 }, KOSDAQ: { name: "코스닥", unit: "", dec: 2 }, USDKRW: { name: "원·달러", unit: "원", dec: 1 },
    DJI: { name: "다우", unit: "", dec: 2 }, SPX: { name: "S&P500", unit: "", dec: 2 }, IXIC: { name: "나스닥", unit: "", dec: 2 }
  };
  var ORDER = ["KOSPI", "KOSDAQ", "USDKRW", "DJI", "SPX", "IXIC"];
  window.__SYM = SYMBOLS; window.__ORDER = ORDER;

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var NUM_RE = /([+\-−▲▼])((?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?(?:조(?:\d{1,3}(?:,\d{3})*)?)?(?:억|만주|만명|%|p|bp|원|엔|달러)?)/g;
  function rich(s) { return esc(s).replace(NUM_RE, function (_m, sign, num) { var up = sign === "+" || sign === "▲"; return '<span class="num ' + (up ? "up" : "down") + '">' + (sign === "−" ? "-" : sign) + num + "</span>"; }).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
  function fmt(v, d) { return Number(v).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function sgn(v) { return v > 0 ? "+" : v < 0 ? "-" : ""; }
  function cls(v) { return v > 0 ? "up" : v < 0 ? "down" : "flat"; }
  function tri(v) { return v > 0 ? "▲" : v < 0 ? "▼" : "—"; }
  var WD = ["일", "월", "화", "수", "목", "금", "토"];
  function ymd(iso) { var p = String(iso).split("-").map(Number); return { y: p[0], m: p[1], d: p[2], wd: WD[new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay()] }; }
  function kdate(iso) { var t = ymd(iso); return t.y + "년 " + t.m + "월 " + t.d + "일 " + t.wd + "요일"; }
  function sdate(iso) { var t = ymd(iso); return t.m + "/" + t.d + "(" + t.wd + ")"; }
  function mdd(iso) { var t = ymd(iso); return t.m + "/" + t.d; }
  function last(arr) { return arr && arr.length ? arr[arr.length - 1] : null; }

  // ---------- data ----------
  function rest(path) {
    return fetch(CFG.supabaseUrl + "/rest/v1/" + path, { headers: { apikey: CFG.anonKey, Authorization: "Bearer " + CFG.anonKey } })
      .then(function (r) { if (!r.ok) throw new Error("데이터 조회 실패 (" + r.status + ")"); return r.json(); });
  }
  function loadBrief(date) {
    var q = date ? "briefs?select=brief_date,basis_date,title,body&published=eq.true&brief_date=eq." + date + "&limit=1"
                 : "briefs?select=brief_date,basis_date,title,body&published=eq.true&order=brief_date.desc&limit=1";
    return rest(q).then(function (rows) { return rows[0] || null; });
  }
  function neighbours(date) {
    return Promise.all([
      rest("briefs?select=brief_date&published=eq.true&brief_date=lt." + date + "&order=brief_date.desc&limit=1"),
      rest("briefs?select=brief_date&published=eq.true&brief_date=gt." + date + "&order=brief_date.asc&limit=1")
    ]).then(function (r) { return { prev: r[0][0] ? r[0][0].brief_date : null, next: r[1][0] ? r[1][0].brief_date : null }; });
  }
  function loadQuotes(basis) {
    return rest("index_quotes?select=quote_date,symbol,close,chg,pct,high,low,note,as_of&quote_date=lte." + basis + "&order=quote_date.desc&limit=240").then(function (rows) {
      var by = {};
      rows.forEach(function (r) { (by[r.symbol] = by[r.symbol] || []); if (by[r.symbol].length < 20) by[r.symbol].push(r); });
      Object.keys(by).forEach(function (k) { by[k].reverse(); });
      return by;
    });
  }
  function loadArchive(limit) {
    return rest("briefs?select=brief_date,basis_date,title&published=eq.true&order=brief_date.desc&limit=" + (limit || 60)).then(function (briefs) {
      if (!briefs.length) return [];
      var dates = Array.from(new Set(briefs.map(function (b) { return b.basis_date; }))).join(",");
      return rest("index_quotes?select=quote_date,pct,chg&symbol=eq.KOSPI&quote_date=in.(" + dates + ")").then(function (ks) {
        var m = {}; ks.forEach(function (k) { m[k.quote_date] = k; });
        return briefs.map(function (b) { b.kospi = m[b.basis_date] || null; return b; });
      });
    });
  }

  // ---------- render ----------
  function masthead(b, nav, archive, expanded) {
    var ed = (b && b.body && b.body.edition) || {};
    var sub = b ? kdate(b.brief_date) + " · " + esc(ed.edited_at || "") + " 편집" + (ed.basis ? " · 기준: " + esc(ed.basis) : "") : "";
    var nav1 = b ? '<a href="?date=' + (nav.prev || "") + '" class="' + (nav.prev ? "" : "dis") + '">‹ ' + (nav.prev ? sdate(nav.prev) : "이전") + '</a><span class="cur">' + sdate(b.brief_date) + '</span><a href="?date=' + (nav.next || "") + '" class="' + (nav.next ? "" : "dis") + '">' + (nav.next ? sdate(nav.next) : "다음") + " ›</a>" : "";
    var actions = [
      b && b.body && b.body.pdf_url ? '<a href="' + esc(b.body.pdf_url) + '" target="_blank" rel="noopener" class="primary">PDF 보기</a>' : "",
      b && b.body && b.body.report_url ? '<a href="' + esc(b.body.report_url) + '" target="_blank" rel="noopener">Word 내려받기</a>' : ""
    ].join("");
    var kicker = expanded ? "Daily Finance &amp; Market Brief" : "Daily Market Brief";
    var tagline = expanded ? '<div class="tagline">' + esc((b && b.body && b.body.tagline) || CFG.tagline || "") + "</div>" : "";
    return '<header class="masthead"><div class="brand"><div class="kicker">' + kicker + '</div><h1>' + CFG.mastheadHtml + "</h1>" + tagline + '<div class="sub">' + sub + "</div></div>" +
      '<div class="tools"><nav class="datenav" aria-label="날짜 이동">' + nav1 + '<a href="' + (archive ? "?" : "?view=archive") + '">' + (archive ? "최신 브리핑" : "아카이브") + '</a></nav><div class="actions">' + actions + "</div></div></header>";
  }
  function archCards(arch, b) {
    return arch.filter(function (a) { return a.brief_date !== b.brief_date; }).slice(0, 3).map(function (a) {
      return '<a href="?date=' + a.brief_date + '"><div class="d"><b>' + sdate(a.brief_date) + "</b><span>코스피 " + (a.kospi ? '<span class="' + cls(a.kospi.pct) + '">' + sgn(a.kospi.pct) + fmt(Math.abs(a.kospi.pct), 2) + "%</span>" : "—") + '</span></div><div class="h">' + esc(a.title) + "</div></a>";
    }).join("");
  }
  // 확장판 호를 기존 증시 화면(?view=market)으로 그리기 위한 변환: body.market_detail 을 본문으로 올린다
  function marketBrief(b) {
    var B = b.body || {}, md = B.market_detail || {};
    var body = Object.assign({}, B, md);
    body.sources = (B.sources || []).filter(function (s) { return !s.page || s.page === "증시"; });
    return { brief_date: b.brief_date, basis_date: b.basis_date, title: md.title || (B.market && B.market.title) || b.title, body: body };
  }
  function ticker(q) {
    return '<div class="ticker num" aria-label="주요 지수">' + ORDER.map(function (s) {
      var m = SYMBOLS[s], r = last(q[s]);
      if (!r) return '<div><span class="n">' + m.name + '</span><span class="flat">—</span></div>';
      var c = r.pct == null ? sgn(r.chg) + fmt(Math.abs(r.chg), m.dec) + m.unit : sgn(r.pct) + fmt(Math.abs(r.pct), 2) + "%";
      return '<div><span class="n">' + m.name + '</span><span><span class="v">' + fmt(r.close, m.dec) + m.unit + '</span> <span class="c ' + cls(r.chg) + '">' + tri(r.chg) + " " + c + "</span></span></div>";
    }).join("") + "</div>";
  }
  function cards(q) {
    return ORDER.map(function (s) {
      var m = SYMBOLS[s], r = last(q[s]);
      if (!r) return '<div class="card"><div class="n">' + m.name + '</div><div class="note">데이터 없음</div></div>';
      var pct = r.pct == null ? "" : sgn(r.pct) + fmt(Math.abs(r.pct), 2) + "%";
      var chg = sgn(r.chg) + fmt(Math.abs(r.chg), m.dec) + (m.unit || "p");
      return '<div class="card ' + cls(r.chg) + '"><div class="n">' + m.name + "<small>" + esc(r.as_of || mdd(r.quote_date) + " 마감") + "</small></div>" +
        '<div class="v">' + fmt(r.close, m.dec) + "<span>" + m.unit + "</span></div>" +
        '<div class="c ' + cls(r.chg) + '">' + tri(r.chg) + " " + (r.pct == null ? chg : pct) + (r.pct == null ? "" : "<span>" + chg + "</span>") + "</div>" +
        '<div data-spark="' + s + '"></div>' + (r.note ? '<div class="note">' + esc(r.note) + "</div>" : "") + "</div>";
    }).join("");
  }
  function usrow(q) {
    return ["DJI", "SPX", "IXIC"].map(function (s) {
      var m = SYMBOLS[s], r = last(q[s]);
      if (!r) return '<div><span class="n">' + m.name + '</span><span class="v">—</span></div>';
      var p = r.pct == null ? r.chg : r.pct;
      return '<div><span class="n">' + m.name + '</span><span class="v">' + fmt(r.close, 2) + '</span><span class="c ' + cls(r.chg) + '">' + sgn(p) + fmt(Math.abs(r.pct || 0), 2) + "%</span></div>";
    }).join("");
  }
  function renderBrief(b, q, nav, arch, mode) {
    var market = mode === "market";
    var B = b.body || {}, H = B.headline || {}, KR = B.kr || {}, US = B.us || {}, ed = B.edition || {};
    var kl = last(q.KOSPI);
    var heroCap = kl && kl.high != null && kl.low != null
      ? mdd(q.KOSPI[0].quote_date) + " ~ " + mdd(kl.quote_date) + " · 음영은 " + mdd(kl.quote_date) + " 장중 고점·저점(" + fmt(kl.high, 2) + " / " + fmt(kl.low, 2) + ")"
      : (kl ? mdd(q.KOSPI[0].quote_date) + " ~ " + mdd(kl.quote_date) : "");
    var subs = (B.subs || []).slice(0, 2).map(function (s) { return '<article><span class="tag ' + (s.warn ? "warn" : "") + '">' + esc(s.tag) + "</span><h3>" + esc(s.title) + "</h3><p>" + rich(s.text) + "</p></article>"; }).join("");
    var items = (B.items || []).map(function (it) { return '<li><div class="k">' + esc(it.k) + "</div><h3>" + esc(it.title) + "</h3><p>" + rich(it.text) + "</p></li>"; }).join("");
    var views = (B.views || []).length ? '<li><div class="k">증권가 시각</div><dl class="views">' + B.views.map(function (v) { return "<dt>" + esc(v.who) + "</dt><dd>" + rich(v.text) + "</dd>"; }).join("") + "</dl></li>" : "";
    var watch = (B.watch || []).map(function (w) { return '<li><span class="when">' + esc(w.when) + "</span><div><b>" + esc(w.title) + "</b>" + (w.lead ? " " + rich(w.lead) : "") + (w.text ? "<small>" + rich(w.text) + "</small>" : "") + "</div></li>"; }).join("");
    var sources = (B.sources || []).map(function (s) { return '<li><span class="src">' + esc(s.media) + '</span><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) + "</a></li>"; }).join("");
    var impl = (B.implications || []).map(function (i) { return '<div><div class="k">' + esc(i.k) + "</div><p>" + rich(i.text) + "</p></div>"; }).join("");
    var arch3 = archCards(arch, b);
    var flows = KR.flows;
    var flowBlock = flows && flows.items && flows.items.length ? '<div class="flow"><div class="t">투자자별 순매수 · ' + esc(flows.market || "코스피") + " " + esc(flows.date || "") + " <span>단위: " + esc(flows.unit || "억원") + '</span></div><svg id="flowChart" viewBox="0 0 560 142" role="img" aria-label="투자자별 순매수"></svg></div>' : "";
    var disclaimer = B.disclaimer || "본 페이지는 정보 제공 목적으로 작성되었으며, 특정 종목·상품에 대한 투자 권유가 아닙니다. 지수·수급 수치는 복수 매체 교차검증과 산술 검산을 통과한 값만 사용했습니다. 기사 본문은 전재하지 않으며 원문은 링크로 제공합니다.";

    document.title = SITE_NAME + " · " + sdate(b.brief_date) + (market ? " 증시 상세" : "");
    window.__Q = q; window.__B = { kr: { flows: KR.flows || null } };
    var back = market ? '<div class="backlink"><a href="?date=' + b.brief_date + '">‹ ' + sdate(b.brief_date) + ' 1면(오늘의 핵심)으로</a></div>' : "";
    return '<div class="page">' + masthead(b, nav, false, market) + ticker(q) + back +
      '<main class="grid"><section class="col hero">' +
      '<div class="eyebrow">' + (market ? "증시 상세 · " : "") + esc(H.kicker || "국내 증시") + "</div>" +
      '<h2 class="head">' + esc(b.title).replace(/\n/g, "<br>") + "</h2>" +
      (H.lede ? '<p class="lede">' + rich(H.lede) + "</p>" : "") +
      '<figure class="hero-chart"><figcaption class="cap"><b>코스피 종가 추이</b><span>' + esc(heroCap) + '</span></figcaption><svg id="heroChart" data-sym="KOSPI" viewBox="0 0 640 230" role="img" aria-label="코스피 종가 추이"></svg></figure>' +
      '<div class="body">' + (KR.paragraphs || []).map(function (p) { return "<p>" + rich(p) + "</p>"; }).join("") + "</div>" +
      flowBlock + (subs ? '<div class="sub2">' + subs + "</div>" : "") +
      '</section><section class="col mid">' +
      '<article class="featured"><span class="tag">' + esc(US.kicker || "미국 증시") + "</span><h3>" + esc(US.title || "").replace(/\n/g, "<br>") + '</h3><div class="usrow num">' + usrow(q) + "</div><p>" + rich(US.text || "") + "</p></article>" +
      '<ul class="list">' + items + views + "</ul>" +
      (sources ? '<div class="sources"><div class="sec"><h2>근거 기사</h2><span class="meta">복수 매체 교차검증</span></div><ul>' + sources + "</ul></div>" : "") +
      '</section><aside class="col side">' +
      '<div class="sec"><h2>주요 지표</h2><span class="meta">종가 · 전일 대비 · 최근 추이</span></div><div class="cards num">' + cards(q) + "</div>" +
      (watch ? '<div class="watch"><div class="sec"><h2>관전포인트</h2><span class="meta">한국시간</span></div><ol>' + watch + "</ol></div>" : "") +
      "</aside></main>" +
      (impl ? '<section class="band"><div class="sec"><h2>금융기관 관점 시사점</h2><span class="meta">기획본부 편집</span></div><div class="impl">' + impl + "</div></section>" : "") +
      '<section class="archive"><div class="sec"><h2>지난 브리핑</h2><span class="meta">날짜를 누르면 해당 일자 첫 화면으로</span></div><div class="arch num">' + arch3 + '<a href="?view=archive" class="more">전체 아카이브 보기 →</a></div></section>' +
      "<footer><p>" + esc(disclaimer) + "</p><p>편집 " + esc(b.brief_date) + " " + esc(ed.edited_at || "") + (ed.next_edition ? " · 다음 편집 " + esc(ed.next_edition) : "") + "</p></footer></div>";
  }

  // ---------- 확장 레이아웃 (body.sections) ----------
  function tagHtml(t, warn, gov) { return '<span class="tag' + (warn ? " warn" : gov ? " gov" : "") + '">' + esc(t) + "</span>"; }
  function srcLine(list, prefix) {
    if (!list || !list.length) return "";
    return '<div class="srcline">' + (prefix || "") + list.map(function (s) { return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.media) + (s.date ? " " + esc(s.date) : "") + "</a>"; }).join(" · ") + "</div>";
  }
  function paper(s) {
    var head = '<div class="ph"><span class="no">' + esc(s.no) + '면</span><h2>' + esc(s.name) + '</h2><span class="meta">' + esc(s.scope || "") + (s.count ? " — 기사 " + esc(s.count) + "건" : "") + "</span></div>";
    if (s.empty) return '<section id="p-' + esc(s.key) + '" class="paper">' + head + '<div class="none">오늘 해당 없음 — 수집 기준 시각 안에 이 지면에 실을 기사가 없었습니다.</div></section>';
    var L = s.lead || {};
    var figs = (L.figures || []).map(function (f) { return '<div><span class="n">' + esc(f.n) + '</span><span class="v">' + esc(f.v) + (f.single_source ? '<span class="ss">단일출처</span>' : "") + '</span><span class="c">' + rich(f.c || "") + "</span></div>"; }).join("");
    var desk = s.desk && s.desk.text ? '<div class="desk"><div class="lab">데스크 코멘트<span>' + esc(s.name) + " · 당사가 신경 쓸 것</span></div>" + (s.desk.title ? "<h4>" + esc(s.desk.title) + "</h4>" : "") + "<p>" + rich(s.desk.text) + "</p></div>" : "";
    var lead = '<article class="lead">' + (L.tag ? tagHtml(L.tag, L.warn, L.gov) : "") + "<h3>" + esc(L.title || "") + "</h3>" +
      (L.paras || []).map(function (p) { return "<p>" + rich(p) + "</p>"; }).join("") + (figs ? '<div class="fig num">' + figs + "</div>" : "") +
      srcLine(L.sources, "출처: ") + (s.related ? '<div class="related">' + esc(s.related) + "</div>" : "") + desk + "</article>";
    var subs = (s.subs || []).map(function (x) { return "<li>" + (x.tag ? tagHtml(x.tag, x.warn, x.gov) : "") + "<h3>" + esc(x.title) + "</h3>" + (x.text ? "<p>" + rich(x.text) + "</p>" : "") + srcLine(x.sources) + "</li>"; }).join("");
    var gov = (s.gov || []).length ? '<div class="sec"><h2>당국 보도자료</h2><span class="meta">' + esc(s.gov_note || "금융위 · 금감원 · 한은") + '</span></div><ul class="gov">' +
      s.gov.map(function (g) { return '<li><span class="d">' + esc(g.date) + " " + esc(g.org) + "</span><span>" + (g.url ? '<a href="' + esc(g.url) + '" target="_blank" rel="noopener">' + esc(g.title) + "</a>" : esc(g.title)) + "</span></li>"; }).join("") + "</ul>" : "";
    var ind = (s.indicators || []).length ? '<div class="sec" style="margin-top:18px"><h2>핵심 지표</h2><span class="meta">최신 공표치</span></div><ul class="mwatch num">' +
      s.indicators.map(function (i) { return '<li><span class="w">' + esc(i.name) + "</span><span><b>" + esc(i.value) + "</b>" + (i.note ? " · " + rich(i.note) : "") + "</span></li>"; }).join("") + "</ul>" : "";
    var aside = "<aside>" + gov + ind + (subs ? '<ul class="subs"' + ((gov || ind) ? ' style="margin-top:14px"' : "") + ">" + subs + "</ul>" : "") + "</aside>";
    return '<section id="p-' + esc(s.key) + '" class="paper">' + head + '<div class="pg">' + lead + aside + "</div></section>";
  }
  function renderExpanded(b, q, nav, arch) {
    var B = b.body || {}, F = B.front || {}, M = B.market || {}, C = B.column || {}, secs = B.sections || [], ed = B.edition || {};
    var byKey = {}; secs.forEach(function (s) { byKey[s.key] = s; });
    var dateQ = "?date=" + b.brief_date;
    var pnav = '<nav class="pnav" aria-label="지면"><a href="#front" class="on"><b>1면</b>오늘의 핵심</a>' +
      secs.map(function (s) { return '<a href="#p-' + esc(s.key) + '"' + (s.empty ? ' class="off"' : "") + "><b>" + esc(s.no) + "면</b>" + esc(s.name) + "</a>"; }).join("") +
      '<a href="#src"><b>부록</b>출처</a>' + (B.market_detail ? '<a href="' + dateQ + '&view=market"><b>상세</b>증시</a>' : "") + "</nav>";
    var keys = (F.keys || []).map(function (k) {
      var s = byKey[k.section] || {};
      var body = s.empty ? '<p class="flat">오늘 해당 없음</p>' : "<p>" + rich(k.text) + (s.no ? ' <a class="more" href="#p-' + esc(k.section) + '">' + esc(s.no) + "면 ›</a>" : "") + "</p>";
      return '<li><div class="k">' + esc(s.name || k.section) + (s.no ? "<small>" + esc(s.no) + "면</small>" : "") + "</div>" + body + "</li>";
    }).join("");
    var mc = ["KOSPI", "KOSDAQ", "USDKRW"].map(function (sym) {
      var m = SYMBOLS[sym], r = last(q[sym]);
      if (!r) return '<div class="mcard"><div class="n">' + m.name + '</div><div class="v">—</div></div>';
      var chg = sgn(r.chg) + fmt(Math.abs(r.chg), m.dec) + (m.unit || ""), pct = r.pct == null ? "" : " (" + sgn(r.pct) + fmt(Math.abs(r.pct), 2) + "%)";
      return '<div class="mcard ' + cls(r.chg) + '"><div class="n">' + m.name + '</div><div class="v">' + fmt(r.close, m.dec) + '</div><div class="c ' + cls(r.chg) + '">' + chg + pct + "</div></div>";
    }).join("");
    var usl = ["DJI", "SPX", "IXIC"].map(function (sym) {
      var m = SYMBOLS[sym], r = last(q[sym]);
      if (!r) return m.name + " —";
      var p = r.pct == null ? r.chg : r.pct;
      return m.name + ' <span class="' + cls(r.chg) + '">' + sgn(p) + fmt(Math.abs(p), 2) + (r.pct == null ? "" : "%") + "</span>";
    }).join(" · ");
    var dj = last(q.DJI), kl = last(q.KOSPI);
    var mwatch = (M.watch || []).map(function (w) { return '<li><span class="w">' + esc(w.when) + "</span><span>" + rich(w.text) + "</span></li>"; }).join("");
    var market = '<aside class="mkt"><div class="sec"><h2>증시 한눈에</h2><span class="meta">' + esc(kl ? (kl.as_of || mdd(kl.quote_date) + " 마감") : "") + " · 교차검증 통과 수치</span></div>" +
      (M.title ? "<h3>" + esc(M.title) + "</h3>" : "") + (M.summary_kr || M.summary_us ? "<p>" + rich(((M.summary_kr || "") + " " + (M.summary_us || "")).trim()) + "</p>" : "") +
      '<div class="mcards num">' + mc + '</div><div class="usline num"><b>미국 ' + esc(dj ? (dj.as_of || mdd(dj.quote_date)).replace(/^현지\s*/, "") : "") + "</b>" + usl + "</div>" +
      (mwatch ? '<ul class="mwatch">' + mwatch + "</ul>" : "") +
      (B.market_detail ? '<div class="mini">수급·종목·차트 등 상세는 <a href="' + dateQ + '&view=market">증시 상세 보기 ›</a></div>' : "") + "</aside>";
    var column = C.title ? '<section class="column" aria-label="데스크 칼럼"><div class="ch"><span class="lab">데스크 칼럼</span><h2>' + esc(C.title) + '</h2><span class="by">' + esc(C.byline || "기획본부 데스크") + '</span></div><div class="cbody">' +
      (C.paras || []).map(function (p) { return "<p>" + rich(p) + "</p>"; }).join("") + '</div><div class="cfoot">칼럼은 보도된 사실을 근거로 한 기획본부의 논평이며 회사의 공식 입장이 아닙니다. 타사에 대한 평가는 기사 인용 범위를 넘지 않습니다.' +
      (C.basis && C.basis.length ? " 근거: " + esc(C.basis.join(" · ")) : "") + "</div></section>" : "";
    var sources = (B.sources || []).map(function (s) { return "<li><b>" + esc(s.media) + '</b><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) + "</a>" + (s.page ? "<i>" + esc(s.page) + "</i>" : "") + "</li>"; }).join("");
    var disclaimer = B.disclaimer || "본 페이지는 정보 제공 목적이며 특정 종목·상품의 매수·매도 권유가 아닙니다. 기사 내용은 요약이며 원문은 출처 링크에서 확인합니다. 회사·기관 실명은 보도된 사실의 범위에서 게재하며, 데스크 칼럼·코멘트는 당사가 유의할 점을 다루는 기획본부의 논평으로 타사에 대한 평가를 담지 않습니다. 고객·개인정보는 포함하지 않습니다.";
    document.title = SITE_NAME + " · " + sdate(b.brief_date);
    return '<div class="page">' + masthead(b, nav, false, true) + pnav + ticker(q) +
      '<main id="front" class="front"><section><div class="eyebrow">' + esc(F.kicker || "오늘의 핵심 · 5개 지면 한눈에") + '</div><h2 class="head">' + esc(b.title).replace(/\n/g, "<br>") + "</h2>" +
      (keys ? '<ul class="keys">' + keys + "</ul>" : "") + "</section>" + market + "</main>" + column + secs.map(paper).join("") +
      (sources ? '<section id="src" class="srcs"><div class="sec"><h2>근거 기사 · 자료</h2><span class="meta">기사 문장 전재 없음 · 수치·요약만 · 원문은 링크</span></div><ul>' + sources + "</ul></section>" : "") +
      '<section class="archive"><div class="sec"><h2>지난 호</h2><span class="meta">날짜를 누르면 해당 호 1면으로</span></div><div class="arch num">' + archCards(arch, b) + '<a href="?view=archive" class="more">전체 아카이브 보기 →</a></div></section>' +
      "<footer><p>" + esc(disclaimer) + "</p><p>편집 " + esc(b.brief_date) + " " + esc(ed.edited_at || "") + (ed.next_edition ? " · 다음 편집 " + esc(ed.next_edition) : "") + "</p></footer></div>";
  }
  function renderArchive(list) {
    document.title = SITE_NAME + " · 아카이브";
    var rows = list.map(function (a) { return '<li><span class="d num">' + sdate(a.brief_date) + '</span><a class="h" href="?date=' + a.brief_date + '">' + esc(a.title.replace(/\n/g, " ")) + '</a><span class="k num">코스피 ' + (a.kospi ? '<span class="' + cls(a.kospi.pct) + '">' + sgn(a.kospi.pct) + fmt(Math.abs(a.kospi.pct), 2) + "%</span>" : "—") + "</span></li>"; }).join("");
    return '<div class="page">' + masthead(null, {}, true) + '<div class="sec" style="margin-top:22px"><h2>아카이브</h2><span class="meta">총 ' + list.length + '편</span></div><ul class="archlist">' + (rows || "<li>아직 게시된 브리핑이 없습니다.</li>") + "</ul></div>";
  }
  function renderMessage(msg) { return '<div class="page">' + masthead(null, {}, false) + '<div class="empty"><p>' + msg + "</p></div></div>"; }

  // ---------- boot ----------
  var root = document.getElementById("app");
  var params = new URLSearchParams(location.search);
  var date = params.get("date"), view = params.get("view");
  function afterRender() { if (window.__drawCharts) window.__drawCharts(); }
  var p;
  if (view === "archive") {
    p = loadArchive(60).then(function (list) { root.innerHTML = renderArchive(list); });
  } else if (date && !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
    p = Promise.resolve().then(function () { root.innerHTML = renderMessage("날짜 형식이 올바르지 않습니다."); });
  } else {
    p = loadBrief(date).then(function (b) {
      if (!b) { root.innerHTML = renderMessage(date ? esc(date) + ' 브리핑이 없습니다. <a href="?view=archive">아카이브</a>에서 다른 날짜를 선택하십시오.' : "아직 게시된 브리핑이 없습니다."); return; }
      return Promise.all([neighbours(b.brief_date), loadQuotes(b.basis_date), loadArchive(8)]).then(function (r) {
        var expanded = !!(b.body && b.body.sections);
        if (expanded && view === "market") { root.innerHTML = renderBrief(marketBrief(b), r[1], r[0], r[2], "market"); afterRender(); }
        else if (expanded) { root.innerHTML = renderExpanded(b, r[1], r[0], r[2]); }
        else { root.innerHTML = renderBrief(b, r[1], r[0], r[2], "legacy"); afterRender(); }
      });
    });
  }
  p.catch(function (e) { root.innerHTML = renderMessage("일시적인 오류입니다. 잠시 후 다시 시도하십시오.<br><small>" + esc(e && e.message) + "</small>"); });
})();

</script>
